# Redraws the contribution halftone, the register strip and the language bar.
# Runs daily (and on demand); never on push, so it cannot trigger itself.
name: draw the charts

on:
  schedule: [{ cron: "20 3 * * *" }]
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: draw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/chart.mjs ${{ github.repository_owner }}
      - name: commit if anything moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chart: redraw the year [skip ci]"
          git push
